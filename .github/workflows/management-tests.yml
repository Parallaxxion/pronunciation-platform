name: Management and shared contracts
on:
  push:
    branches: [main, 'work/**', 'feat/**']
    paths: ['03_管理端/当前开发/**', '04_接口说明/联调工具/**', '.github/workflows/management-tests.yml']
  pull_request:
    paths: ['03_管理端/当前开发/**', '04_接口说明/联调工具/**', '.github/workflows/management-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: management-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  management:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12'
      # pip prints the Chinese repository path; Windows runners default to cp1252.
      - run: python -X utf8 -m pip install -r "03_管理端/当前开发/backend/requirements-dev.txt"
      - run: python -m pytest -q "03_管理端/当前开发/backend/tests" "04_接口说明/联调工具/tests"
      - run: node --version
      - run: node --check "03_管理端/当前开发/web/app.mjs"
      - run: node --test "03_管理端/当前开发/web/test.mjs" "03_管理端/当前开发/web-components/test.mjs"
