<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>采集统计与数据导出</title><style>
body{margin:0;background:#f3f6fb;color:#1c2b43;font:15px "Microsoft YaHei",sans-serif}.wrap{max-width:1250px;margin:32px auto;padding:0 20px}h1{margin:0}.muted{color:#78869b;margin:8px 0 22px}.panel,.card{background:white;border:1px solid #e5eaf1;border-radius:12px;padding:18px}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters label{display:grid;gap:6px;color:#718098;font-size:13px}input,select{padding:9px;border:1px solid #d8e0eb;border-radius:7px;color:#273951;background:#fff}button,.link{border:0;padding:10px 14px;background:#2865d5;color:white;border-radius:7px;text-decoration:none;cursor:pointer}.secondary{background:#edf2fa;color:#2c4f85}.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:16px 0}.card{padding:14px}.card span{font-size:12px;color:#76849a}.card b{display:block;font-size:25px;margin-top:8px}.layout{display:grid;grid-template-columns:1fr 1.3fr;gap:16px}.bar{display:grid;grid-template-columns:100px 1fr 40px;align-items:center;gap:8px;margin:12px 0;font-size:13px}.track{height:10px;background:#edf1f6;border-radius:8px;overflow:hidden}.fill{height:100%;background:#5592ee}.table{overflow:auto;margin-top:10px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{color:#748198}.hint{padding:12px;background:#fff8e8;color:#715719;border-radius:8px;margin-top:16px;font-size:13px}.error{color:#a22}.downloads{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}}@media(max-width:500px){.cards{grid-template-columns:repeat(2,1fr)}}
</style></head><body><main class="wrap"><h1>采集统计与数据导出</h1><div class="muted">按题目、诊断与核查状态筛选；统计口径以录音记录为单位，偏误数量按错误明细条数计。</div><section class="panel"><div class="filters"><label>题目ID<input id="question" placeholder="全部题目"></label><label>诊断状态<select id="diagnosis"><option value="">全部</option><option value="completed">已完成</option><option value="pending">待处理</option><option value="failed">失败</option></select></label><label>核查状态<select id="review"><option value="">全部</option><option value="pending">待核查</option><option value="passed">已通过</option><option value="needs_review">需复核</option></select></label><label>起始日期<input id="from" type="date"></label><label>结束日期<input id="to" type="date"></label><button onclick="load()">应用筛选</button><button class="secondary" onclick="resetFilters()">重置</button></div></section><div class="cards" id="cards"></div><section class="layout"><div class="panel"><b>偏误类型分布</b><div id="types"></div></div><div class="panel"><b>记录明细（当前筛选）</b><div class="downloads" style="margin:12px 0"><a id="csv" class="link">下载完整 CSV</a><a id="json" class="link secondary">下载完整 JSON</a></div><div class="table"><table><thead><tr><th>记录ID</th><th>题目版本</th><th>诊断状态</th><th>核查状态</th><th>偏误条数</th></tr></thead><tbody id="rows"></tbody></table></div></div></section><div class="hint" id="hint">样例数据仅用于功能演示。导出字段含学生代号，不含姓名、账号、音频路径。用于正式环境前需接入身份权限和机构批准的数据范围。</div><p id="error" class="error"></p></main><script>
const labels={total:'录音记录',diagnosis_completed:'诊断完成',diagnosis_pending:'诊断待处理',review_pending:'待核查',review_passed:'核查通过',review_needs_review:'需复核',error_occurrences:'偏误明细条数'};const $=x=>document.getElementById(x);function params(){let p=new URLSearchParams();[['question_id','question'],['diagnosis_status','diagnosis'],['review_status','review'],['from','from'],['to','to']].forEach(([k,id])=>{let v=$(id).value;if(v){if(k==='to'){const [y,m,d]=v.split('-').map(Number);v=new Date(Date.UTC(y,m-1,d+1)).toISOString().slice(0,10)}p.set(k,v)}});return p}async function load(){try{$('error').textContent='';let p=params(),[s,r]=await Promise.all([fetch('/api/stats?'+p),fetch('/api/records?'+p)]);if(!s.ok||!r.ok)throw Error('API 请求失败');let a=await s.json(),b=await r.json();$('cards').innerHTML=Object.entries(a.counts).map(([k,v])=>`<div class="card"><span>${labels[k]||k}</span><b>${v}</b></div>`).join('');let max=Math.max(1,...a.error_types.map(x=>x.count));$('types').innerHTML=a.error_types.length?a.error_types.map(x=>`<div class="bar"><span>${x.error_type}</span><div class="track"><div class="fill" style="width:${x.count/max*100}%"></div></div><b>${x.count}</b></div>`).join(''):'<p class="muted">当前筛选没有偏误明细</p>';$('rows').innerHTML=b.items.map(x=>`<tr><td>${x.recording_id}</td><td>${x.question_id} / ${x.question_version}</td><td>${x.diagnosis_status||'无结果'}</td><td>${x.review_status||'未设置'}</td><td>${x.error_count}</td></tr>`).join('')||'<tr><td colspan="5">无匹配记录</td></tr>';let qs=p.toString();$('csv').href='/api/export.csv?'+qs;$('json').href='/api/export.json?'+qs;$('hint').textContent=a.demo_data?'当前为本地构造样例数据。指标按筛选后的录音记录统计，偏误类型按 diagnosis_errors 明细条数统计。':'已连接数据源。请核对当前用户的数据授权范围。'}catch(e){$('error').textContent='无法读取统计 API：'+e.message+'。请按 README 启动 server.py。'}}function resetFilters(){['question','diagnosis','review','from','to'].forEach(id=>$(id).value='');load()}load();
</script></body></html>
